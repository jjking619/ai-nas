name: voice-assistant
services:
  voice_assistant:
    image: python:3.11-slim
    container_name: voice_assistant
    restart: unless-stopped
    command:
      - python3
      - /app/app.py
    environment:
      LISTEN_HOST: 0.0.0.0
      PORT: "8082"
      UPSTREAM_BASE_URL: http://host.docker.internal:28082
      TRIGGER_TIMEOUT_SEC: "300"
      APP_TITLE: 语音助手
      TRIGGER_TOKEN: ""
      LOG_FILE: /logs/voice_remote.log
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - type: bind
        source: /home/pi/NAS-Demo/voice_remote/app.py
        target: /app/app.py
        read_only: true
      - type: bind
        source: /home/pi/NAS-Demo/voice_remote/static
        target: /app/static
        read_only: true
      - type: bind
        source: /home/pi/NAS-Demo/logs
        target: /logs
    ports:
      - mode: ingress
        target: 8082
        published: "28083"
        protocol: tcp
    x-casaos:
      envs:
        - container: UPSTREAM_BASE_URL
          description:
            en_US: Voice bridge upstream URL
        - container: TRIGGER_TOKEN
          description:
            en_US: Optional trigger token
      ports:
        - container: "8082"
          description:
            en_US: Voice assistant web UI

x-casaos:
  architectures:
    - amd64
    - arm64
  author: local
  category: Utilities
  description:
    en_US: Click-to-use voice and text assistant with TTS playback.
  developer: local
  icon: "data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96'%3E%3Crect width='96' height='96' rx='20' fill='%230f172a'/%3E%3Ccircle cx='48' cy='44' r='18' fill='%23f59e0b'/%3E%3Crect x='42' y='58' width='12' height='20' rx='6' fill='%23f59e0b'/%3E%3Crect x='30' y='74' width='36' height='6' rx='3' fill='%2338bdf8'/%3E%3C/svg%3E"
  id: org.local.voice.assistant
  is_uncontrolled: false
  main: voice_assistant
  port_map: "28083"
  store_app_id: voice-assistant
  tagline:
    en_US: 语音助手
  thumbnail: ""
  title:
    en_US: 语音助手
