version: "3.8"

services:
  openclaw:
    image: openclaw/openclaw:latest
    platform: linux/arm64
    container_name: openclaw
    restart: unless-stopped
    init: true
    networks:
      - default
      - immich-net
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: casaos
      TZ: Asia/Shanghai
      IMMICH_URL: http://immich-server:2283
      IMMICH_API_KEY: HmPpUh8KFg6ZP6JTZ3s3jxGutth7q4VzjSAyosW6w
    command:
      - /bin/bash
      - -lc
      - node dist/index.js gateway --bind lan --allow-unconfigured --port 18789
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "24190:18789"
      - "18790:18790"
    volumes:
      - /DATA/AppData/openclaw:/home/node/.openclaw
      - /home/pi/nas_share:/nas_share

  media_downloader:
    build:
      context: ./media_downloader
    container_name: media_downloader
    restart: unless-stopped
    environment:
      DOWNLOAD_ROOT: /downloads
      PORT: 8081
      YTDLP_TIMEOUT_SEC: 1800
      # Optional: point to an existing TTS webhook if available.
      TTS_WEBHOOK_URL: ""
      DOWNLOAD_TTS_TEXT: 下载已完成
    volumes:
      - /home/pi/nas_share/downloads:/downloads
    ports:
      - "28081:8081"

networks:
  immich-net:
    external: true
    name: big-bear-immich_big_bear_immich_network
