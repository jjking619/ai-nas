version: "3.8"

services:
  openclaw:
    image: openclaw/openclaw:latest
    platform: linux/arm64
    container_name: openclaw
    restart: unless-stopped
    init: true
    environment:
      HOME: /home/node
      OPENCLAW_HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: casaos
      TZ: Asia/Shanghai
      IMMICH_URL: http://10.55.84.133:2283
      IMMICH_API_KEY: HmPpUh8KFg6ZP6JTZ3s3jxGutth7q4VzjSAyosW6w
    command:
      - /bin/bash
      - -lc
      - node dist/index.js gateway --bind lan --allow-unconfigured --port 18789
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "24190:18789"
      - "18790:18790"
    volumes:
      - /DATA/AppData/openclaw:/home/node/.openclaw
      - /home/pi/nas_share:/nas_share
